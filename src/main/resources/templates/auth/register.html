<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
    <div class="container auth-container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-xl-5 col-lg-6 col-md-8">
                <div class="auth-card">
                    <div class="auth-header text-center mb-4">
                        <div class="brand-mark large">LMS</div>
                        <h2>Create account</h2>
                        <p>Register to access the Learning Management System.</p>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger auto-dismiss" role="alert">
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/register}" th:object="${user}" method="post">
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label" for="fullName">Full Name</label>
                                <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="Enter full name">
                                <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="username">Username</label>
                                <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="Choose username">
                                <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="email">Email</label>
                                <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Enter email address">
                                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="password">Password</label>
                                <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Create password">
                                <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="confirmPassword">Confirm Password</label>
                                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="Repeat password">
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">Register</button>
                        </div>
                    </form>

                    <div class="auth-footer mt-4 text-center">
                        <span>Already have an account?</span>
                        <a th:href="@{/login}" class="ms-1">Login here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/script.js}"></script>
</body>
</html>
