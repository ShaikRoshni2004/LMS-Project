<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('courses')}"></div>

    <main class="main-panel">
        <div th:replace="~{fragments/navbar :: navbar(${pageTitle})}"></div>

        <div class="content-area">
            <div class="page-header">
                <h3>Course Management</h3>
                <a th:href="@{/courses/add}" class="btn btn-primary">+ Add Course</a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success auto-dismiss" role="alert" th:text="${successMessage}"></div>

            <div class="search-bar">
                <form th:action="@{/courses}" method="get" class="d-flex flex-wrap gap-2 w-100">
                    <input type="text" name="query" class="form-control" th:value="${query}" placeholder="Search by course name, code or instructor">
                    <select name="status" class="form-select" style="max-width: 180px;">
                        <option value="">All Status</option>
                        <option value="Active" th:selected="${status == 'Active'}">Active</option>
                        <option value="Inactive" th:selected="${status == 'Inactive'}">Inactive</option>
                        <option value="Completed" th:selected="${status == 'Completed'}">Completed</option>
                    </select>
                    <button type="submit" class="btn btn-primary">Search</button>
                    <a th:href="@{/courses}" class="btn btn-outline-secondary">Reset</a>
                </form>
            </div>

            <div class="card panel-card">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                        <tr>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Instructor</th>
                            <th>Duration</th>
                            <th>Fee</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(courses)}">
                            <td colspan="7" class="empty-state">No courses found.</td>
                        </tr>
                        <tr th:each="course : ${courses}">
                            <td th:text="${course.courseCode}">CS101</td>
                            <td th:text="${course.courseName}">Advanced Java</td>
                            <td th:text="${course.instructorName}">Instructor</td>
                            <td th:text="${course.duration}">12 Weeks</td>
                            <td th:text="${'$' + course.courseFee}">$1200</td>
                            <td>
                                <span class="badge" th:classappend="${course.status == 'Active'} ? ' badge-active' : (${course.status == 'Completed'} ? ' badge-completed' : ' badge-inactive')"
                                      th:text="${course.status}">Active</span>
                            </td>
                            <td>
                                <div class="action-group">
                                    <a th:href="@{/courses/{id}(id=${course.courseId})}" class="btn btn-outline-primary btn-sm">View</a>
                                    <a th:href="@{/courses/edit/{id}(id=${course.courseId})}" class="btn btn-outline-secondary btn-sm">Edit</a>
                                    <form th:action="@{/courses/delete/{id}(id=${course.courseId})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Delete this course?')">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
