<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('courses')}"></div>

    <main class="main-panel">
        <div th:replace="~{fragments/navbar :: navbar(${pageTitle})}"></div>

        <div class="content-area">
            <div class="page-header">
                <h3>Course Details</h3>
                <div class="action-group">
                    <a th:href="@{/courses/edit/{id}(id=${course.courseId})}" class="btn btn-outline-primary">Edit</a>
                    <a th:href="@{/courses}" class="btn btn-outline-secondary">Back</a>
                </div>
            </div>

            <div class="form-section">
                <div class="detail-grid">
                    <div class="detail-item">
                        <span class="label">Course ID</span>
                        <span class="value" th:text="${course.courseId}">1</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Course Name</span>
                        <span class="value" th:text="${course.courseName}">Course</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Course Code</span>
                        <span class="value" th:text="${course.courseCode}">Code</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Instructor</span>
                        <span class="value" th:text="${course.instructorName}">Instructor</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Duration</span>
                        <span class="value" th:text="${course.duration}">Duration</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Course Fee</span>
                        <span class="value" th:text="${'$' + course.courseFee}">$0.00</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Start Date</span>
                        <span class="value" th:text="${#temporals.format(course.startDate, 'yyyy-MM-dd')}">Date</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">End Date</span>
                        <span class="value" th:text="${#temporals.format(course.endDate, 'yyyy-MM-dd')}">Date</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Status</span>
                        <span class="badge" th:classappend="${course.status == 'Active'} ? ' badge-active' : (${course.status == 'Completed'} ? ' badge-completed' : ' badge-inactive')" th:text="${course.status}">Active</span>
                    </div>
                    <div class="detail-item" style="grid-column: 1 / -1;">
                        <span class="label">Description</span>
                        <span class="value" th:text="${course.description}">Description</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
