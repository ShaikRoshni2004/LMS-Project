<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('courses')}"></div>

    <main class="main-panel">
        <div th:replace="~{fragments/navbar :: navbar(${pageTitle})}"></div>

        <div class="content-area">
            <div class="page-header">
                <h3>Edit Course</h3>
                <a th:href="@{/courses}" class="btn btn-outline-secondary">Back to Courses</a>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

            <div class="form-section">
                <form th:action="@{/courses/update/{id}(id=${course.courseId})}" th:object="${course}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="courseName">Course Name</label>
                            <input type="text" id="courseName" th:field="*{courseName}" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="courseCode">Course Code</label>
                            <input type="text" id="courseCode" th:field="*{courseCode}" class="form-control">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label" for="description">Description</label>
                            <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="duration">Duration</label>
                            <input type="text" id="duration" th:field="*{duration}" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="instructorName">Instructor Name</label>
                            <input type="text" id="instructorName" th:field="*{instructorName}" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="courseFee">Course Fee</label>
                            <input type="number" step="0.01" id="courseFee" th:field="*{courseFee}" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="startDate">Start Date</label>
                            <input type="date" id="startDate" th:field="*{startDate}" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="endDate">End Date</label>
                            <input type="date" id="endDate" th:field="*{endDate}" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="status">Status</label>
                            <select id="status" th:field="*{status}" class="form-select">
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Update Course</button>
                        <a th:href="@{/courses}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
