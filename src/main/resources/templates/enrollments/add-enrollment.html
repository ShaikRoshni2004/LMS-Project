<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Enrollment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('enrollments')}"></div>

    <main class="main-panel">
        <div th:replace="~{fragments/navbar :: navbar(${pageTitle})}"></div>

        <div class="content-area">
            <div class="page-header">
                <h3>Enroll Student</h3>
                <a th:href="@{/enrollments}" class="btn btn-outline-secondary">Back to Enrollments</a>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

            <div class="form-section">
                <form th:action="@{/enrollments/save}" th:object="${enrollment}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="studentId">Student</label>
                            <select id="studentId" th:field="*{studentId}" class="form-select">
                                <option value="">Select Student</option>
                                <option th:each="student : ${students}" th:value="${student.studentId}" th:text="${student.fullName}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="courseId">Course</label>
                            <select id="courseId" th:field="*{courseId}" class="form-select">
                                <option value="">Select Course</option>
                                <option th:each="course : ${courses}" th:value="${course.courseId}" th:text="${course.courseName}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="enrollmentDate">Enrollment Date</label>
                            <input type="date" id="enrollmentDate" th:field="*{enrollmentDate}" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="status">Status</label>
                            <select id="status" th:field="*{status}" class="form-select">
                                <option value="Enrolled">Enrolled</option>
                                <option value="Completed">Completed</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Enrollment</button>
                        <a th:href="@{/enrollments}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
