<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Enrollments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('enrollments')}"></div>

    <main class="main-panel">
        <div th:replace="~{fragments/navbar :: navbar(${pageTitle})}"></div>

        <div class="content-area">
            <div class="page-header">
                <h3>Enrollment Management</h3>
                <a th:href="@{/enrollments/add}" class="btn btn-primary">+ Enroll Student</a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success auto-dismiss" role="alert" th:text="${successMessage}"></div>

            <div class="search-bar">
                <form th:action="@{/enrollments}" method="get" class="d-flex flex-wrap gap-2 w-100">
                    <select name="studentId" class="form-select" style="max-width: 220px;">
                        <option value="">Filter by Student</option>
                        <option th:each="student : ${students}" th:value="${student.studentId}" th:text="${student.fullName}" th:selected="${student.studentId == selectedStudentId}"></option>
                    </select>
                    <select name="courseId" class="form-select" style="max-width: 220px;">
                        <option value="">Filter by Course</option>
                        <option th:each="course : ${courses}" th:value="${course.courseId}" th:text="${course.courseName}" th:selected="${course.courseId == selectedCourseId}"></option>
                    </select>
                    <select name="status" class="form-select" style="max-width: 180px;">
                        <option value="">All Status</option>
                        <option value="Enrolled" th:selected="${selectedStatus == 'Enrolled'}">Enrolled</option>
                        <option value="Completed" th:selected="${selectedStatus == 'Completed'}">Completed</option>
                        <option value="Cancelled" th:selected="${selectedStatus == 'Cancelled'}">Cancelled</option>
                    </select>
                    <button type="submit" class="btn btn-primary">Apply</button>
                    <a th:href="@{/enrollments}" class="btn btn-outline-secondary">Reset</a>
                </form>
            </div>

            <div class="card panel-card">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                        <tr>
                            <th>Enrollment ID</th>
                            <th>Student</th>
                            <th>Course</th>
                            <th>Enrollment Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(enrollments)}">
                            <td colspan="6" class="empty-state">No enrollments found.</td>
                        </tr>
                        <tr th:each="enrollment : ${enrollments}">
                            <td th:text="${enrollment.enrollmentId}">1</td>
                            <td th:text="${enrollment.student.fullName}">Student</td>
                            <td th:text="${enrollment.course.courseName}">Course</td>
                            <td th:text="${#temporals.format(enrollment.enrollmentDate, 'yyyy-MM-dd')}">2024-01-01</td>
                            <td>
                                <span class="badge" th:classappend="${enrollment.status == 'Enrolled'} ? ' badge-active' : (${enrollment.status == 'Completed'} ? ' badge-completed' : ' badge-inactive')"
                                      th:text="${enrollment.status}">Enrolled</span>
                            </td>
                            <td>
                                <div class="action-group">
                                    <a th:href="@{/enrollments/edit/{id}(id=${enrollment.enrollmentId})}" class="btn btn-outline-secondary btn-sm">Edit</a>
                                    <form th:action="@{/enrollments/delete/{id}(id=${enrollment.enrollmentId})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Cancel this enrollment?')">Cancel</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
