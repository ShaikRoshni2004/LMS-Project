<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('students')}"></div>

    <main class="main-panel">
        <div th:replace="~{fragments/navbar :: navbar(${pageTitle})}"></div>

        <div class="content-area">
            <div class="page-header">
                <h3>Student Details</h3>
                <div class="action-group">
                    <a th:href="@{/students/edit/{id}(id=${student.studentId})}" class="btn btn-outline-primary">Edit</a>
                    <a th:href="@{/students}" class="btn btn-outline-secondary">Back</a>
                </div>
            </div>

            <div class="form-section">
                <div class="detail-grid">
                    <div class="detail-item">
                        <span class="label">Student ID</span>
                        <span class="value" th:text="${student.studentId}">1</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Full Name</span>
                        <span class="value" th:text="${student.fullName}">Name</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Email</span>
                        <span class="value" th:text="${student.email}">email</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Phone</span>
                        <span class="value" th:text="${student.phone}">Phone</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Gender</span>
                        <span class="value" th:text="${student.gender}">Gender</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Date of Birth</span>
                        <span class="value" th:text="${#temporals.format(student.dateOfBirth, 'yyyy-MM-dd')}">Date</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">City</span>
                        <span class="value" th:text="${student.city}">City</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Status</span>
                        <span class="badge" th:classappend="${student.status == 'Active'} ? ' badge-active' : ' badge-inactive'" th:text="${student.status}">Active</span>
                    </div>
                    <div class="detail-item" style="grid-column: 1 / -1;">
                        <span class="label">Address</span>
                        <span class="value" th:text="${student.address}">Address</span>
                    </div>
                    <div class="detail-item">
                        <span class="label">Registration Date</span>
                        <span class="value" th:text="${#temporals.format(student.registrationDate, 'yyyy-MM-dd')}">Date</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
