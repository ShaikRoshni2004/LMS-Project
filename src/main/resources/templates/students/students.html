<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('students')}"></div>

    <main class="main-panel">
        <div th:replace="~{fragments/navbar :: navbar(${pageTitle})}"></div>

        <div class="content-area">
            <div class="page-header">
                <h3>Student Management</h3>
                <a th:href="@{/students/add}" class="btn btn-primary">+ Add Student</a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success auto-dismiss" role="alert" th:text="${successMessage}"></div>

            <div class="search-bar">
                <form th:action="@{/students}" method="get" class="d-flex flex-wrap gap-2 w-100">
                    <input type="text" name="query" class="form-control" th:value="${query}" placeholder="Search by name, ID, email or phone">
                    <select name="status" class="form-select" style="max-width: 180px;">
                        <option value="">All Status</option>
                        <option value="Active" th:selected="${status == 'Active'}">Active</option>
                        <option value="Inactive" th:selected="${status == 'Inactive'}">Inactive</option>
                    </select>
                    <button type="submit" class="btn btn-primary">Search</button>
                    <a th:href="@{/students}" class="btn btn-outline-secondary">Reset</a>
                </form>
            </div>

            <div class="card panel-card">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>City</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(students)}">
                            <td colspan="7" class="empty-state">No students found.</td>
                        </tr>
                        <tr th:each="student : ${students}">
                            <td th:text="${student.studentId}">1</td>
                            <td th:text="${student.fullName}">Student Name</td>
                            <td th:text="${student.email}">name@example.com</td>
                            <td th:text="${student.phone}">123456</td>
                            <td th:text="${student.city}">City</td>
                            <td>
                                <span class="badge" th:classappend="${student.status == 'Active'} ? ' badge-active' : ' badge-inactive'"
                                      th:text="${student.status}">Active</span>
                            </td>
                            <td>
                                <div class="action-group">
                                    <a th:href="@{/students/{id}(id=${student.studentId})}" class="btn btn-outline-primary btn-sm">View</a>
                                    <a th:href="@{/students/edit/{id}(id=${student.studentId})}" class="btn btn-outline-secondary btn-sm">Edit</a>
                                    <form th:action="@{/students/delete/{id}(id=${student.studentId})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Delete this student?')">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
