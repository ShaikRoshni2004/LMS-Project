<aside th:fragment="sidebar(activePage)" class="sidebar">
    <div class="sidebar-header">
        <div class="brand-mark">LMS</div>
        <div class="brand-text">Learning Hub</div>
    </div>

    <nav class="sidebar-nav">
        <a th:href="@{/dashboard}" class="nav-item" th:classappend="${activePage == 'dashboard'} ? ' active' : ''">
            <i class="bi bi-grid-1x2-fill"></i>
            <span>Dashboard</span>
        </a>
        <a th:href="@{/students}" class="nav-item" th:classappend="${activePage == 'students'} ? ' active' : ''">
            <i class="bi bi-people-fill"></i>
            <span>Students</span>
        </a>
        <a th:href="@{/courses}" class="nav-item" th:classappend="${activePage == 'courses'} ? ' active' : ''">
            <i class="bi bi-book-half"></i>
            <span>Courses</span>
        </a>
        <a th:href="@{/enrollments}" class="nav-item" th:classappend="${activePage == 'enrollments'} ? ' active' : ''">
            <i class="bi bi-journal-check"></i>
            <span>Enrollments</span>
        </a>
        <a th:href="@{/reports}" class="nav-item" th:classappend="${activePage == 'reports'} ? ' active' : ''">
            <i class="bi bi-bar-chart-line-fill"></i>
            <span>Reports</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="logout-button">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </button>
        </form>
    </div>
</aside>
